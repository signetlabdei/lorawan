# ns-3 CI/CD script with jobs of the code-linting stage
#
# Contains jobs to perform lint checking.
name: "Check code linting"
run-name: "linting"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Clang-tidy
  clang-tidy-22:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:rolling
    timeout-minutes: 180
    env:
      CLANG_TIDY_VERSION: 22
      URL: ${{ github.server_url }}/${{ github.repository }}
      git: "git -C src/lorawan"
    steps:
      # The following step is required in all jobs that use this repo's actions
      - name: "Retrieve actions from repository"
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - name: "Install required system packages"
        run: >
          apt update && DEBIAN_FRONTEND=noninteractive apt install -y
          clang-tidy-$CLANG_TIDY_VERSION clang-$CLANG_TIDY_VERSION cmake libstdc++-16-dev
          libboost-dev
          git wget
      - name: "Checkout this repository as ns-3 module"
        uses: ./.github/actions/checkout-in-ns3
      - name: "Configure ns-3 CMake"
        run: >
          CXX=clang++-$CLANG_TIDY_VERSION ./ns3 configure -d debug
          --enable-clang-tidy
          --enable-examples --enable-tests --enable-asserts
          --enable-modules lorawan
      - name: "Store default branch"
        run: >
          echo "DEFAULT_BRANCH=$($git remote show $URL | sed -n '/HEAD branch:/s/.*: //p')" >> $GITHUB_ENV
      - name: "Prepare git environment"
        run: >
          if ($git remote | grep -qw upstream) ; then
          $git remote remove upstream ;
          fi &&
          $git remote add -t $DEFAULT_BRANCH --no-tags -f upstream $URL
      - name: "Select files to check"
        run: >
          if [[ $GITHUB_REF_NAME == $DEFAULT_BRANCH ]] ; then
            echo "FILES_TO_CHECK=src/lorawan/" >> $GITHUB_ENV;
            echo "Running clang-tidy on all files";
          else
            FILES_TO_CHECK=$($git diff --name-only --line-prefix=src/lorawan/ upstream/$DEFAULT_BRANCH);
            echo "FILES_TO_CHECK=\"$FILES_TO_CHECK\"" >> $GITHUB_ENV;
            echo "Running clang-tidy on the following changed files:";
            echo $FILES_TO_CHECK | fmt -w1;
          fi
      - name: "Run clang-tidy"
        run: run-clang-tidy-$CLANG_TIDY_VERSION -p cmake-cache/ -quiet -hide-progress -use-color=true -warnings-as-errors=* $FILES_TO_CHECK
      - run: echo "No clang-tidy errors found"
